const defaultWidth = 500;
const defaultHeight = 600;
function setup() {
  noCanvas();
  for (const link of links) {
    const a = createA(link.url, link.label, '_blank');
    a.position(link.x, link.y);
    a.attribute('rel', 'noopener noreferrer');
    // A real href preserves keyboard access and normal open-in-new-tab behaviour.
    a.elt.addEventListener('click', event => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      openPopup(link);
    });
  }
}
function openPopup(link) {
  const w = link.w || defaultWidth;
  const h = link.h || defaultHeight;
  // Repetition stacks in one place, as in the lecturer's example.
  const popup = window.open(link.url, '_blank',
    `width=${w},height=${h},left=100,top=50,resizable=yes,scrollbars=yes`);
  if (popup) popup.opener = null;
  else window.location.assign(link.url);
}
